site_name: aWallet Password Manager
site_url: https://synpet.github.io/awallet-website/   # becomes https://www.awallet.org/ at the DNS switch (step 5)
site_description: aWallet — encrypted password manager for Android and iOS.
copyright: © Petr Synek
use_directory_urls: true

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/brightness-4, name: Light mode }

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list          # explicit heading ids: {#h.2a86ld1hnga3} keeps the old Google Sites anchors
  - md_in_html
  - admonition
  - pymdownx.details   # collapsible FAQ answers
  - pymdownx.superfences
  - tables
  - toc:
      permalink: false

plugins:
  - search
  - redirects:
      redirect_maps:
        home/index.md: index.md   # /home was a second address of the home page

nav:
  - Home: index.md
  - Feature Matrix: home/feature-matrix.md
  - Download: download.md
  - FAQ: faq.md
  - FAQ Cloud:
      - faq-cloud/index.md
      - Restore Google Drive revision: faq-cloud/restore-google-drive-revision.md
  - FAQ iOS: faq-ios.md
  - Documentation:
      - documentation/index.md
      - Privacy Policy: documentation/privacy-policy.md
      - Technical Documentation: documentation/technical-documentation.md
  - Contact: contact.md
